<svg width="1920" height="1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="nebulaGlow1" cx="30%" cy="40%">
      <stop offset="0%" style="stop-color:#2a0a4a;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#030010;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="nebulaGlow2" cx="70%" cy="60%">
      <stop offset="0%" style="stop-color:#0a1a4a;stop-opacity:0.25" />
      <stop offset="100%" style="stop-color:#030010;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#1a0a3a;stop-opacity:0.4" />
      <stop offset="50%" style="stop-color:#0a0520;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#030010;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1920" height="1080" fill="#030010"/>
  
  <!-- Nebula effects -->
  <ellipse cx="576" cy="432" rx="500" ry="400" fill="url(#nebulaGlow1)"/>
  <ellipse cx="1344" cy="648" rx="450" ry="350" fill="url(#nebulaGlow2)"/>
  <ellipse cx="960" cy="540" rx="600" ry="500" fill="url(#centerGlow)"/>
  
  <!-- Stars scattered across the background -->
