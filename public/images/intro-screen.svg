  <!-- Center content area -->
  <g transform="translate(960, 540)">
    <!-- Subtitle -->
    <text x="0" y="-120" font-family="monospace" font-size="12" fill="#ffffff" opacity="0.3" text-anchor="middle" letter-spacing="3">A JOURNEY INTO THE UNKNOWN</text>
    
    <!-- Main title -->
    <text x="0" y="-40" font-family="system-ui" font-size="72" fill="#ffffff" opacity="0.9" text-anchor="middle" font-weight="200" letter-spacing="8">AETHER</text>
    <text x="0" y="40" font-family="system-ui" font-size="72" fill="#aaccff" opacity="0.7" text-anchor="middle" font-weight="200" letter-spacing="8">COSMOS</text>
    
    <!-- Description -->
    <text x="0" y="120" font-family="system-ui" font-size="16" fill="#ffffff" opacity="0.4" text-anchor="middle">
      <tspan x="0" dy="0">Beyond the edge of known space lies an uncharted star system.</tspan>
      <tspan x="0" dy="24">Five worlds await discovery, each holding secrets older than memory itself.</tspan>
    </text>
    
    <!-- Enter button -->
    <rect x="-120" y="200" width="240" height="50" rx="25" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.2"/>
    <rect x="-120" y="200" width="240" height="50" rx="25" fill="url(#centerGlow)" opacity="0.3"/>
    <text x="0" y="232" font-family="system-ui" font-size="14" fill="#ffffff" opacity="0.8" text-anchor="middle" letter-spacing="2">Enter the Universe</text>
    
    <!-- Footer note -->
    <text x="0" y="320" font-family="monospace" font-size="10" fill="#ffffff" opacity="0.2" text-anchor="middle">✦ Fictional universe — all data is world-building ✦</text>
  </g>
