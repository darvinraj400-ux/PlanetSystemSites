<svg width="1920" height="1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="lensingGlow" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#1a0a3a;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#020008;stop-opacity:0" />
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="2" />
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1920" height="1080" fill="#030010"/>
  
  <!-- Header -->
  <text x="60" y="60" font-family="system-ui" font-size="28" fill="#ffffff" font-weight="300" letter-spacing="2">The Observatory</text>
  <text x="60" y="85" font-family="system-ui" font-size="12" fill="#ffffff" opacity="0.4">Interactive cosmic phenomenon simulations</text>
  
  <!-- Control buttons -->
  <rect x="1750" y="40" width="40" height="40" rx="8" fill="#ffffff" opacity="0.05"/>
  <circle cx="1770" cy="60" r="8" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
  <line x1="1770" y1="55" x2="1770" y2="65" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
  
  <rect x="1810" y="40" width="40" height="40" rx="8" fill="#ffffff" opacity="0.05"/>
  <path d="M 1825,55 L 1835,60 L 1825,65 Z" fill="#ffffff" opacity="0.7"/>
  
  <!-- Simulation tabs -->
  <rect x="60" y="120" width="200" height="40" rx="8" fill="#ffffff" opacity="0.1" stroke="#ffffff" stroke-width="1" opacity="0.2"/>
  <circle cx="85" cy="140" r="6" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
  <text x="105" y="145" font-family="system-ui" font-size="12" fill="#ffffff" opacity="0.9">Gravitational Lensing</text>
  
  <rect x="280" y="120" width="120" height="40" rx="8" fill="#ffffff" opacity="0.02" stroke="#ffffff" stroke-width="1" opacity="0.1"/>
  <text x="305" y="145" font-family="system-ui" font-size="12" fill="#ffffff" opacity="0.5">Pulsar</text>
  
  <rect x="420" y="120" width="120" height="40" rx="8" fill="#ffffff" opacity="0.02" stroke="#ffffff" stroke-width="1" opacity="0.1"/>
  <text x="445" y="145" font-family="system-ui" font-size="12" fill="#ffffff" opacity="0.5">Nebula</text>
  
  <!-- Main simulation canvas -->
  <rect x="60" y="180" width="1800" height="700" rx="12" fill="#020008" stroke="#ffffff" stroke-width="1" opacity="0.1"/>
  
  <!-- Gravitational lensing simulation -->
  <!-- Background stars (distorted) -->
  <circle cx="400" cy="350" r="2" fill="#ffffff" opacity="0.6"/>
  <circle cx="550" cy="420" r="1.5" fill="#aaccff" opacity="0.5"/>
  <circle cx="700" cy="380" r="2" fill="#ffffff" opacity="0.7"/>
  <circle cx="850" cy="450" r="1.5" fill="#ffddaa" opacity="0.6"/>
  <circle cx="1000" cy="400" r="2" fill="#ffffff" opacity="0.5"/>
  <circle cx="1150" cy="380" r="1.5" fill="#aaccff" opacity="0.7"/>
  <circle cx="1300" cy="420" r="2" fill="#ffffff" opacity="0.6"/>
  <circle cx="1450" cy="350" r="1.5" fill="#ffffff" opacity="0.5"/>
  
  <!-- Distorted stars near the mass -->
  <ellipse cx="800" cy="500" rx="8" ry="3" fill="#ffffff" opacity="0.4" filter="url(#blur)"/>
  <ellipse cx="1100" cy="520" rx="10" ry="4" fill="#aaccff" opacity="0.3" filter="url(#blur)"/>
  <ellipse cx="900" cy="580" rx="12" ry="5" fill="#ffffff" opacity="0.35" filter="url(#blur)"/>
  
  <!-- Einstein ring -->
  <circle cx="960" cy="530" r="120" fill="none" stroke="#4466ff" stroke-width="3" opacity="0.4"/>
  <circle cx="960" cy="530" r="130" fill="none" stroke="#4466ff" stroke-width="2" opacity="0.25"/>
  <circle cx="960" cy="530" r="140" fill="none" stroke="#4466ff" stroke-width="1.5" opacity="0.15"/>
  
  <!-- Light arcs -->
  <path d="M 840,480 A 120,120 0 0,1 900,430" fill="none" stroke="#4466ff" stroke-width="2" opacity="0.5"/>
  <path d="M 1020,430 A 120,120 0 0,1 1080,480" fill="none" stroke="#4466ff" stroke-width="2" opacity="0.5"/>
  <path d="M 840,580 A 120,120 0 0,0 900,630" fill="none" stroke="#4466ff" stroke-width="2" opacity="0.5"/>
  <path d="M 1020,630 A 120,120 0 0,0 1080,580" fill="none" stroke="#4466ff" stroke-width="2" opacity="0.5"/>
  
  <!-- Central mass (black hole/lensing object) -->
  <circle cx="960" cy="530" r="60" fill="url(#lensingGlow)"/>
  <circle cx="960" cy="530" r="40" fill="#000000"/>
  
  <!-- Distortion visualization -->
  <path d="M 700,530 Q 850,500 960,530 Q 1070,560 1220,530" fill="none" stroke="#4466ff" stroke-width="1" opacity="0.2" stroke-dasharray="5,5"/>
  
  <!-- Simulation label -->
  <text x="100" y="850" font-family="system-ui" font-size="10" fill="#ffffff" opacity="0.3" font-style="italic">Artistic simulation of gravitational lensing — not to scale</text>
  
  <!-- Control panel -->
  <rect x="60" y="900" width="1800" height="140" rx="12" fill="#000000" opacity="0.3"/>
  
  <!-- Parameters label -->
  <text x="80" y="930" font-family="system-ui" font-size="11" fill="#ffffff" opacity="0.5" letter-spacing="1">PARAMETERS</text>
  
  <!-- Sliders -->
  <text x="80" y="965" font-family="system-ui" font-size="10" fill="#ffffff" opacity="0.4" letter-spacing="1">INTENSITY</text>
  <rect x="80" y="975" width="300" height="4" rx="2" fill="#ffffff" opacity="0.1"/>
  <rect x="80" y="975" width="210" height="4" rx="2" fill="#6366f1"/>
  <circle cx="290" cy="977" r="6" fill="#6366f1" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
  
  <text x="420" y="965" font-family="system-ui" font-size="10" fill="#ffffff" opacity="0.4" letter-spacing="1">SPEED</text>
  <rect x="420" y="975" width="300" height="4" rx="2" fill="#ffffff" opacity="0.1"/>
  <rect x="420" y="975" width="150" height="4" rx="2" fill="#6366f1"/>
  <circle cx="570" cy="977" r="6" fill="#6366f1" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
  
  <text x="760" y="965" font-family="system-ui" font-size="10" fill="#ffffff" opacity="0.4" letter-spacing="1">DENSITY</text>
  <rect x="760" y="975" width="300" height="4" rx="2" fill="#ffffff" opacity="0.1"/>
  <rect x="760" y="975" width="180" height="4" rx="2" fill="#6366f1"/>
  <circle cx="940" cy="977" r="6" fill="#6366f1" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
  
  <text x="1100" y="965" font-family="system-ui" font-size="10" fill="#ffffff" opacity="0.4" letter-spacing="1">PRIMARY COLOR</text>
  <rect x="1100" y="975" width="60" height="32" rx="4" fill="#4466ff" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
  
  <!-- Description box -->
  <rect x="80" y="1020" width="1760" height="60" rx="8" fill="#ffffff" opacity="0.02" stroke="#ffffff" stroke-width="1" opacity="0.1"/>
  <text x="100" y="1045" font-family="system-ui" font-size="11" fill="#ffffff" opacity="0.5">
    <tspan x="100" dy="0">Gravitational lensing occurs when massive objects bend spacetime, curving the path of light from background sources. This</tspan>
    <tspan x="100" dy="16">simulation shows how a massive body distorts the appearance of stars behind it, creating Einstein rings and multiple images.</tspan>
  </text>
  
  <!-- Return button -->
  <rect x="20" y="20" width="100" height="40" rx="8" fill="#ffffff" opacity="0.05" stroke="#ffffff" stroke-width="1" opacity="0.1"/>
  <path d="M 45,40 L 35,40 M 35,40 L 40,35 M 35,40 L 40,45" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
  <text x="55" y="45" font-family="system-ui" font-size="12" fill="#ffffff" opacity="0.7">Return</text>
</svg>
