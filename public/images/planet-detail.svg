<svg width="1920" height="1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="panelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#030010;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#0a0520;stop-opacity:0.92" />
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="20" />
    </filter>
  </defs>
  
  <!-- Background space scene -->
  <rect width="1920" height="1080" fill="#020008"/>
  
  <!-- Stars -->
  <circle cx="150" cy="120" r="1.5" fill="#ffffff" opacity="0.7"/>
  <circle cx="280" cy="180" r="1" fill="#aaccff" opacity="0.6"/>
  <circle cx="450" cy="90" r="1.2" fill="#ffffff" opacity="0.8"/>
  <circle cx="680" cy="150" r="1" fill="#ffddaa" opacity="0.7"/>
  <circle cx="820" cy="220" r="1.5" fill="#ffffff" opacity="0.6"/>
  <circle cx="950" cy="130" r="1" fill="#aaccff" opacity="0.7"/>
  <circle cx="1050" cy="280" r="1.2" fill="#ffffff" opacity="0.8"/>
  <circle cx="200" cy="450" r="1" fill="#ffffff" opacity="0.7"/>
  <circle cx="380" cy="520" r="1.5" fill="#aaccff" opacity="0.6"/>
  <circle cx="750" cy="480" r="1" fill="#ffffff" opacity="0.8"/>
  <circle cx="1100" cy="550" r="1.2" fill="#ffddaa" opacity="0.7"/>
  <circle cx="1250" cy="180" r="1" fill="#ffffff" opacity="0.6"/>
  <circle cx="1450" cy="250" r="1.5" fill="#aaccff" opacity="0.7"/>
  <circle cx="1650" cy="150" r="1" fill="#ffffff" opacity="0.8"/>
  
  <!-- Planet in background (Vesper - ocean planet) -->
  <circle cx="600" cy="540" r="280" fill="#1a5a9c"/>
  <circle cx="600" cy="540" r="310" fill="#5ab8ff" opacity="0.08"/>
  <ellipse cx="520" cy="480" rx="80" ry="40" fill="#ffffff" opacity="0.15"/>
  <ellipse cx="680" cy="600" rx="70" ry="35" fill="#ffffff" opacity="0.12"/>
  
  <!-- Planet Detail Panel (right side) -->
  <rect x="1440" y="0" width="480" height="1080" fill="url(#panelBg)" filter="url(#blur)"/>
  <rect x="1440" y="0" width="480" height="1080" fill="#030010" opacity="0.9"/>
  <line x1="1440" y1="0" x2="1440" y2="1080" stroke="#5ab8ff" stroke-width="1" opacity="0.15"/>
  
  <!-- Panel Content -->
  <!-- Classification badge -->
  <rect x="1480" y="60" width="200" height="32" rx="16" fill="#5ab8ff" opacity="0.1" stroke="#5ab8ff" stroke-width="1" opacity="0.3"/>
  <text x="1580" y="82" font-family="monospace" font-size="12" fill="#5ab8ff" text-anchor="middle" letter-spacing="2">CLASS IV OCEAN WORLD</text>
  
  <!-- Planet name -->
  <text x="1480" y="150" font-family="system-ui" font-size="48" fill="#ffffff" font-weight="300" letter-spacing="2">VESPER</text>
  
  <!-- Description -->
  <text x="1480" y="190" font-family="system-ui" font-size="14" fill="#ffffff" opacity="0.5">
    <tspan x="1480" dy="0">A luminous ocean planet shrouded in perpetual</tspan>
    <tspan x="1480" dy="20">twilight. Its vast seas of liquid methane reflect</tspan>
    <tspan x="1480" dy="20">the light of distant stars, creating an ethereal</tspan>
    <tspan x="1480" dy="20">blue glow visible from orbit.</tspan>
  </text>
  
  <!-- Stats Grid -->
  <rect x="1480" y="300" width="200" height="80" rx="8" fill="#5ab8ff" opacity="0.05" stroke="#5ab8ff" stroke-width="1" opacity="0.1"/>
  <text x="1500" y="325" font-family="system-ui" font-size="10" fill="#5ab8ff" opacity="0.7" letter-spacing="1">ORBITAL PERIOD</text>
  <text x="1500" y="355" font-family="system-ui" font-size="18" fill="#ffffff" opacity="0.9">847 cycles</text>
  
  <rect x="1700" y="300" width="200" height="80" rx="8" fill="#5ab8ff" opacity="0.05" stroke="#5ab8ff" stroke-width="1" opacity="0.1"/>
  <text x="1720" y="325" font-family="system-ui" font-size="10" fill="#5ab8ff" opacity="0.7" letter-spacing="1">RELATIVE SIZE</text>
  <text x="1720" y="355" font-family="system-ui" font-size="18" fill="#ffffff" opacity="0.9">1.4× Sol</text>
  
  <!-- Surface Conditions -->
  <text x="1480" y="430" font-family="system-ui" font-size="11" fill="#ffffff" opacity="0.6" letter-spacing="1">SURFACE CONDITIONS</text>
  <text x="1480" y="455" font-family="system-ui" font-size="12" fill="#ffffff" opacity="0.5">
    <tspan x="1480" dy="0">Temperature: -142°C</tspan>
    <tspan x="1480" dy="18">Pressure: 3.2 atm</tspan>
    <tspan x="1480" dy="18">Ocean coverage: 94%</tspan>
  </text>
  
  <!-- Phenomenon Box -->
  <rect x="1480" y="540" width="400" height="120" rx="12" fill="#5ab8ff" opacity="0.05" stroke="#5ab8ff" stroke-width="1" opacity="0.15"/>
  <text x="1500" y="570" font-family="system-ui" font-size="14" fill="#ffffff" opacity="0.9" font-weight="500">The Abyssal Choir</text>
  <text x="1500" y="595" font-family="system-ui" font-size="11" fill="#ffffff" opacity="0.5">
    <tspan x="1500" dy="0">Bioluminescent organisms synchronize their light</tspan>
    <tspan x="1500" dy="16">emissions across entire ocean basins, creating vast</tspan>
    <tspan x="1500" dy="16">patterns visible from space.</tspan>
  </text>
  
  <!-- Discovery Timeline -->
  <text x="1480" y="710" font-family="system-ui" font-size="11" fill="#ffffff" opacity="0.6" letter-spacing="1">DISCOVERY TIMELINE</text>
  
  <circle cx="1490" cy="740" r="3" fill="#5ab8ff"/>
  <text x="1510" y="735" font-family="monospace" font-size="10" fill="#5ab8ff">Cycle 2847</text>
  <text x="1510" y="750" font-family="system-ui" font-size="11" fill="#ffffff" opacity="0.5">First detected as anomalous blue signal</text>
  
  <circle cx="1490" cy="790" r="3" fill="#5ab8ff"/>
  <text x="1510" y="785" font-family="monospace" font-size="10" fill="#5ab8ff">Cycle 2851</text>
  <text x="1510" y="800" font-family="system-ui" font-size="11" fill="#ffffff" opacity="0.5">Spectral analysis confirms ocean world</text>
  
  <circle cx="1490" cy="840" r="3" fill="#5ab8ff"/>
  <text x="1510" y="835" font-family="monospace" font-size="10" fill="#5ab8ff">Cycle 2856</text>
  <text x="1510" y="850" font-family="system-ui" font-size="11" fill="#ffffff" opacity="0.5">First probe reveals bioluminescent life</text>
  
  <!-- Close button -->
  <circle cx="1880" cy="40" r="16" fill="#ffffff" opacity="0.05"/>
  <line x1="1874" y1="34" x2="1886" y2="46" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
  <line x1="1886" y1="34" x2="1874" y2="46" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
  
  <!-- Bottom navigation -->
  <rect x="0" y="1000" width="1440" height="80" fill="#000000" opacity="0.5"/>
  
  <!-- Planet list -->
  <rect x="40" y="1020" width="100" height="40" rx="8" fill="#ffffff" opacity="0.03" stroke="#ffffff" stroke-width="1" opacity="0.1"/>
  <circle cx="65" cy="1040" r="8" fill="#1a0d05"/>
  <text x="85" y="1045" font-family="system-ui" font-size="12" fill="#ffffff" opacity="0.5">Nyx</text>
  
  <rect x="160" y="1020" width="120" height="40" rx="8" fill="#ffffff" opacity="0.1" stroke="#5ab8ff" stroke-width="1" opacity="0.3"/>
  <circle cx="185" cy="1040" r="8" fill="#1a5a9c"/>
  <text x="205" y="1045" font-family="system-ui" font-size="12" fill="#ffffff" opacity="0.9">Vesper</text>
  
  <rect x="300" y="1020" width="110" height="40" rx="8" fill="#ffffff" opacity="0.03" stroke="#ffffff" stroke-width="1" opacity="0.1"/>
  <circle cx="325" cy="1040" r="8" fill="#d4c8b0"/>
  <text x="345" y="1045" font-family="system-ui" font-size="12" fill="#ffffff" opacity="0.5">Elyra</text>
  
  <rect x="430" y="1020" width="120" height="40" rx="8" fill="#ffffff" opacity="0.03" stroke="#ffffff" stroke-width="1" opacity="0.1"/>
  <circle cx="455" cy="1040" r="8" fill="#d49030"/>
  <text x="475" y="1045" font-family="system-ui" font-size="12" fill="#ffffff" opacity="0.5">Aureon</text>
  
  <rect x="570" y="1020" width="120" height="40" rx="8" fill="#ffffff" opacity="0.03" stroke="#ffffff" stroke-width="1" opacity="0.1"/>
  <circle cx="595" cy="1040" r="8" fill="#b8e0f0"/>
  <text x="615" y="1045" font-family="system-ui" font-size="12" fill="#ffffff" opacity="0.5">Solune</text>
  
  <!-- Mode buttons -->
  <rect x="1280" y="1020" width="120" height="40" rx="8" fill="#ffffff" opacity="0.05" stroke="#ffffff" stroke-width="1" opacity="0.1"/>
  <text x="1340" y="1045" font-family="system-ui" font-size="12" fill="#ffffff" opacity="0.6" text-anchor="middle">Observatory</text>
  
  <rect x="1420" y="1020" width="100" height="40" rx="8" fill="#ffffff" opacity="0.05" stroke="#ffffff" stroke-width="1" opacity="0.1"/>
  <text x="1470" y="1045" font-family="system-ui" font-size="12" fill="#ffffff" opacity="0.6" text-anchor="middle">Star Atlas</text>
</svg>
