<svg width="1920" height="1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="starGlow" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="20%" style="stop-color:#aaccff;stop-opacity:0.9" />
      <stop offset="50%" style="stop-color:#4466cc;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#020008;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="nebula1" cx="25%" cy="35%">
      <stop offset="0%" style="stop-color:#3a1a5a;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#020008;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="nebula2" cx="75%" cy="65%">
      <stop offset="0%" style="stop-color:#1a2a5a;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#020008;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="oceanPlanet" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#5ab8ff;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#1a5a9c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d3060;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="volcanicPlanet" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#ff6622;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#cc3300;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a0d05;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="gasGiant" cx="45%" cy="45%">
      <stop offset="0%" style="stop-color:#ffbb55;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#d49030;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5a3010;stop-opacity:1" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1920" height="1080" fill="#020008"/>
  
  <!-- Nebula effects -->
  <ellipse cx="480" cy="378" rx="400" ry="300" fill="url(#nebula1)"/>
  <ellipse cx="1440" cy="702" rx="350" ry="280" fill="url(#nebula2)"/>
  
  <!-- Stars - various sizes and colors -->
  <circle cx="150" cy="120" r="2" fill="#ffffff" opacity="0.9"/>
  <circle cx="280" cy="180" r="1.5" fill="#aaccff" opacity="0.7"/>
  <circle cx="450" cy="90" r="1.8" fill="#ffffff" opacity="0.8"/>
  <circle cx="680" cy="150" r="1.5" fill="#ffddaa" opacity="0.7"/>
  <circle cx="820" cy="220" r="2" fill="#ffffff" opacity="0.9"/>
  <circle cx="950" cy="130" r="1.5" fill="#aaccff" opacity="0.8"/>
  <circle cx="1050" cy="280" r="1.8" fill="#ffffff" opacity="0.7"/>
  <circle cx="1250" cy="180" r="2" fill="#ffddaa" opacity="0.8"/>
  <circle cx="1450" cy="250" r="1.5" fill="#ffffff" opacity="0.7"/>
  <circle cx="1650" cy="150" r="1.8" fill="#aaccff" opacity="0.8"/>
  <circle cx="200" cy="450" r="1.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="380" cy="520" r="2" fill="#aaccff" opacity="0.9"/>
  <circle cx="750" cy="480" r="1.5" fill="#ffffff" opacity="0.7"/>
  <circle cx="1100" cy="550" r="1.8" fill="#ffddaa" opacity="0.8"/>
  <circle cx="1350" cy="620" r="2" fill="#ffffff" opacity="0.9"/>
  <circle cx="1750" cy="480" r="1.5" fill="#aaccff" opacity="0.7"/>
  <circle cx="100" cy="750" r="1.8" fill="#ffffff" opacity="0.8"/>
  <circle cx="550" cy="820" r="1.5" fill="#ffddaa" opacity="0.7"/>
  <circle cx="950" cy="780" r="2" fill="#ffffff" opacity="0.9"/>
  <circle cx="1550" cy="850" r="1.5" fill="#aaccff" opacity="0.8"/>
  
  <!-- Orbit paths (subtle) -->
  <ellipse cx="960" cy="540" rx="180" ry="180" fill="none" stroke="#5ab8ff" stroke-width="1" opacity="0.15"/>
  <ellipse cx="960" cy="540" rx="320" ry="320" fill="none" stroke="#d4c8b0" stroke-width="1" opacity="0.15"/>
  <ellipse cx="960" cy="540" rx="520" ry="520" fill="none" stroke="#ffbb55" stroke-width="1" opacity="0.15"/>
  
  <!-- Central star with glow -->
  <circle cx="960" cy="540" r="120" fill="url(#starGlow)" filter="url(#glow)"/>
  <circle cx="960" cy="540" r="45" fill="#aaccff"/>
  <circle cx="960" cy="540" r="35" fill="#ffffff" opacity="0.6"/>
  
  <!-- Nyx - Volcanic planet (closest) -->
  <g transform="translate(780, 420)">
    <circle r="22" fill="url(#volcanicPlanet)"/>
    <circle r="24" fill="#ff5522" opacity="0.15"/>
    <!-- Lava cracks -->
    <path d="M -8,-5 Q -5,-8 0,-6 Q 5,-4 8,-7" stroke="#ff4400" stroke-width="1.5" fill="none" opacity="0.8"/>
    <path d="M -10,2 Q -6,5 -2,3 Q 3,1 7,4" stroke="#ff6622" stroke-width="1" fill="none" opacity="0.7"/>
  </g>
  
  <!-- Vesper - Ocean planet -->
  <g transform="translate(1140, 540)">
    <circle r="32" fill="url(#oceanPlanet)"/>
    <circle r="36" fill="#5ab8ff" opacity="0.12"/>
    <!-- Cloud patterns -->
    <ellipse cx="-8" cy="-5" rx="12" ry="6" fill="#ffffff" opacity="0.2"/>
    <ellipse cx="10" cy="8" rx="10" ry="5" fill="#ffffff" opacity="0.15"/>
  </g>
  
  <!-- Elyra - Ringed planet -->
  <g transform="translate(640, 680)">
    <circle r="28" fill="#d4c8b0"/>
    <ellipse rx="55" ry="12" fill="none" stroke="#d4c8b0" stroke-width="3" opacity="0.6"/>
    <ellipse rx="55" ry="12" fill="none" stroke="#f0e8d8" stroke-width="1" opacity="0.4"/>
  </g>
  
  <!-- Aureon - Gas giant (largest) -->
  <g transform="translate(1380, 720)">
    <circle r="65" fill="url(#gasGiant)"/>
    <!-- Atmospheric bands -->
    <ellipse cx="0" cy="-20" rx="60" ry="8" fill="#5a3010" opacity="0.3"/>
    <ellipse cx="0" cy="10" rx="62" ry="10" fill="#d49030" opacity="0.4"/>
    <ellipse cx="0" cy="35" rx="58" ry="7" fill="#5a3010" opacity="0.25"/>
    <!-- Great Vortex -->
    <ellipse cx="25" cy="-15" rx="18" ry="12" fill="#cc4400" opacity="0.5"/>
  </g>
  
  <!-- Solune - Crystal moon (orbiting Aureon) -->
  <g transform="translate(1480, 650)">
    <circle r="14" fill="#b8e0f0"/>
    <circle r="16" fill="#90d8ff" opacity="0.2"/>
    <!-- Crystal facets -->
    <path d="M -5,-8 L 0,-12 L 5,-8 L 3,-3 L -3,-3 Z" fill="#ffffff" opacity="0.3"/>
    <path d="M -8,2 L -4,8 L 4,8 L 8,2 L 4,-2 L -4,-2 Z" fill="#ffffff" opacity="0.25"/>
  </g>
</svg>
